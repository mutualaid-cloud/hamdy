    <style>
        :root {
            --bg-dark: #070d19;
            --bg-card: #0e1a2f;
            --accent-blue: #1e40af;
            --accent-cyan: #38bdf8;
            --text-light: #f0f9ff;
            --text-muted: #94a3b8;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        body[dir="rtl"] {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1, h2, .brand-logo { font-family: 'Cinzel', serif; }

        header {
            padding: 1.5rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
            background: rgba(7, 13, 25, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .brand-logo {
            font-size: 1.3rem;
            color: var(--text-light);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 700;
        }
        .brand-logo span { color: var(--accent-cyan); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .back-link {
            color: var(--accent-cyan);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }
        .back-link:hover { transform: translateX(-4px); }

        .lang-select {
            background: rgba(7, 13, 25, 0.4);
            color: var(--text-light);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: var(--transition);
        }

        .lang-select option {
            background: var(--bg-dark);
            color: var(--text-light);
        }

        .portfolio-header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
        }
        .portfolio-header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .portfolio-header p { color: var(--text-muted); font-size: 0.9rem; }

        /* --- Grid de Fotos --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.2rem;
            padding: 1.5rem 6% 4rem;
        }

        .photo-card {
            position: relative;
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            aspect-ratio: 4/5;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .photo-card:hover img {
            transform: scale(1.06);
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(7, 13, 25, 0.85) 0%, transparent 60%);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 1rem;
            opacity: 0;
            transition: var(--transition);
        }

        .photo-card:hover .photo-overlay { opacity: 1; }

        .btn-buy {
            padding: 0.45rem 0.9rem;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #fff;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: var(--transition);
        }

        .btn-buy:hover { 
            transform: scale(1.05);
            box-shadow: 0 6px 18px rgba(56, 189, 248, 0.5);
        }

        /* --- Lightbox --- */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(4, 8, 16, 0.95);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            flex-direction: column;
        }

        .lightbox.active { display: flex; }

        .lightbox-img {
            max-width: 90%;
            max-height: 75vh;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            object-fit: contain;
        }

        .lightbox-controls {
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .close-lightbox {
            position: absolute;
            top: 2rem;
            right: 2rem;
            color: var(--text-light);
            font-size: 2rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .close-lightbox:hover { color: var(--accent-cyan); }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>

        // Renderizar fotos
        driveIds.forEach((id, index) => {
            const imgUrl = `https://lh3.googleusercontent.com/d/${id}`;
            const photoNum = index + 1;
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.onclick = () => openLightbox(imgUrl);

            card.innerHTML = `
                <img src="${imgUrl}" alt="Photo ${photoNum}" loading="lazy">
                <div class="photo-overlay">
                    <span style="font-size: 0.85rem; font-weight: 500;">#${photoNum}</span>

                    </button>
                </div>
            `;
            galleryGrid.appendChild(card);
        });

        function openLightbox(url) {
            lightboxImg.src = url;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        function changeLanguage(lang) {
            // Guarda la preferencia de idioma en el navegador
            localStorage.setItem('site_lang', lang);
            document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('langSelect').value = lang;

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
        }
