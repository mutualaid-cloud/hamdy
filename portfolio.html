<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Hamdy Photographer</title>
    
    <!-- Favicon SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0-2-2h-3l-2.5-3z'/><circle cx='12' cy='13' r='3'/></svg>">

    <!-- Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #070d19;
            --bg-card: #0e1a2f;
            --accent-blue: #1e40af;
            --accent-cyan: #38bdf8;
            --text-light: #f0f9ff;
            --text-muted: #94a3b8;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        body[dir="rtl"] {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1, h2, .brand-logo { font-family: 'Cinzel', serif; }

        header {
            padding: 1.5rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
            background: rgba(7, 13, 25, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .brand-logo {
            font-size: 1.3rem;
            color: var(--text-light);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 700;
        }
        .brand-logo span { color: var(--accent-cyan); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .back-link {
            color: var(--accent-cyan);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }
        .back-link:hover { transform: translateX(-4px); }

        .lang-select {
            background: rgba(7, 13, 25, 0.4);
            color: var(--text-light);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: var(--transition);
        }

        .lang-select option {
            background: var(--bg-dark);
            color: var(--text-light);
        }

        .portfolio-header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
        }
        .portfolio-header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .portfolio-header p { color: var(--text-muted); font-size: 0.9rem; }

        /* --- Grid de Fotos --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.2rem;
            padding: 1.5rem 6% 4rem;
        }

        .photo-card {
            position: relative;
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            aspect-ratio: 4/5;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .photo-card:hover img {
            transform: scale(1.06);
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(7, 13, 25, 0.85) 0%, transparent 60%);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 1rem;
            opacity: 0;
            transition: var(--transition);
        }

        .photo-card:hover .photo-overlay { opacity: 1; }

        .btn-buy {
            padding: 0.45rem 0.9rem;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #fff;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: var(--transition);
        }

        .btn-buy:hover { transform: scale(1.05); }

        /* --- Lightbox --- */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(4, 8, 16, 0.95);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            flex-direction: column;
        }

        .lightbox.active { display: flex; }

        .lightbox-img {
            max-width: 90%;
            max-height: 75vh;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            object-fit: contain;
        }

        .lightbox-controls {
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .close-lightbox {
            position: absolute;
            top: 2rem;
            right: 2rem;
            color: var(--text-light);
            font-size: 2rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .close-lightbox:hover { color: var(--accent-cyan); }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand-logo">Hamdy <span>Abu Sido</span></a>
        <div class="header-actions">
            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> <span data-i18n="back-home">Back to Home</span>
            </a>
            <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="ar">العربية</option>
                <option value="es">Español</option>
                <option value="pt">Português</option>
            </select>
        </div>
    </header>

    <div class="portfolio-header">
        <h1 data-i18n="portfolio-title">Selected Works</h1>
        <p data-i18n="portfolio-sub">Explore high-resolution photographs and license original digital prints.</p>
    </div>

    <!-- Galería con las fotos filtradas de Google Drive -->
    <div class="gallery-grid" id="galleryGrid"></div>

    <!-- Modal Visor Grande -->
    <div class="lightbox" id="lightbox">
        <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
        <img src="" alt="Enlarged preview" class="lightbox-img" id="lightboxImg">
        <div class="lightbox-controls">
            <a href="#" id="lightboxBuyBtn" class="btn-buy" style="padding: 0.7rem 1.5rem; font-size: 0.9rem;">
                <i class="fa-solid fa-envelope"></i> <span data-i18n="buy-btn">Buy this picture</span>
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> Hamdy Photographer. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const translations = {
            en: {
                "nav-about": "About",
                "nav-portfolio": "Portfolio",
                "hero-tagline": "Photographer, Writer & Seeker of Light",
                "hero-btn": "Explore Works",
                "bio-p1": "My journey with the camera began in 2010, driven by boundless passion and a dream of going as far as possible in the world of photography. Although circumstances dictated a different path, that dream remained alive within me. Today, I find a new opportunity in every shot to continue with a more mature perspective.",
                "bio-p2": "Beyond being a photographer, I am a writer. I view images and words as two sides of the same quest. For me, photography is a space for meditation; each image holds an intimate story and the echo of emotions felt in the instant I pressed the shutter."
            },
            es: {
                "nav-about": "Sobre mí",
                "nav-portfolio": "Portafolio",
                "hero-tagline": "Fotógrafo, escritor y buscador de luz",
                "hero-btn": "Explorar Obras",
                "bio-p1": "Mi viaje con la cámara comenzó en 2010, impulsado por una pasión sin límites. Aunque las circunstancias dictaron un camino diferente, ese sueño permaneció vivo en mí. Hoy encuentro en cada toma una nueva oportunidad para continuar con una perspectiva más madura.",
                "bio-p2": "Más allá de ser fotógrafo, soy escritor. Veo las imágenes y las palabras como dos caras de la misma búsqueda. Para mí, la fotografía es un espacio de meditación; cada imagen guarda una historia íntima y el eco de las emociones sentidas al disparar."
            },
            pt: {
                "nav-about": "Sobre",
                "nav-portfolio": "Portfólio",
                "hero-tagline": "Fotógrafo, escritor e buscador da luz",
                "hero-btn": "Explorar Obras",
                "bio-p1": "Minha jornada com a câmera começou em 2010. Embora as circunstâncias tenham ditado um caminho diferente, esse sonho permaneceu vivo dentro de mim. Hoje, encontro em cada foto uma nova oportunidade de continuar com uma perspectiva mais madura.",
                "bio-p2": "Além de fotógrafo, sou escritor. Vejo imagens e palavras como dois lados da mesma busca. Para mim, a fotografia é um espaço de meditação; cada imagem guarda uma história íntima."
            },
            ar: {
                "nav-about": "من أنا",
                "nav-portfolio": "معرض الأعمال",
                "hero-tagline": "مصور، كاتب، والباحث عن الضوء",
                "hero-btn": "استكشف الأعمال",
                "bio-p1": "بدأت رحلتي مع الكاميرا في عام 2010 بشغف لا حدود له. قادتني الظروف إلى مسارات مختلفة، لكن الحلم ظل حياً في داخلي. أجد اليوم في كل لقطة فرصة جديدة لمواصلة الرحلة برؤية أكثر نضجاً وثباتاً.",
                "bio-p2": "إلى جانب كوني مصوراً، أنا كاتب. أرى الصور والكلمات كوجهين لجمال واحد. بالنسبة لي، التصوير هو مساحة للتأمل؛ كل صورة تحمل قصة حميمة وصداً للمشاعر لحظة التقاطها."
            }
        };

        function changeLanguage(lang) {
            // Guarda la preferencia de idioma en el navegador
            localStorage.setItem('site_lang', lang);
            
            document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('langSelect').value = lang;

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
        }

        // Cargar el idioma guardado al entrar
        const savedLang = localStorage.getItem('site_lang') || 'en';
        changeLanguage(savedLang);
    </script>
</body>
</html>
